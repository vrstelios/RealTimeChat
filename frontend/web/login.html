<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RealTimeChat - Sign In</title>
  <link rel="stylesheet" href="/assets/css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-layout">

  <div class="auth-container">
    <div class="auth-header">
      <div class="logo-dot"></div>
      <h1>Welcome back</h1>
      <p class="auth-subtitle">We're so excited to see you again!</p>
    </div>

    <div class="auth-form">
      <div class="input-group">
        <label for="email">EMAIL</label>
        <input id="email" type="email" autocomplete="email" required />
      </div>

      <div class="input-group">
        <label for="password">PASSWORD</label>
        <input id="password" type="password" autocomplete="current-password" required />
      </div>

      <p id="error" class="error-message"></p>

      <button class="btn-primary" onclick="login()">Log In</button>

      <p class="auth-switch">
        Need an account? <a href="/signup">Register here</a>
      </p>
    </div>
  </div>

  <script src="/assets/js/login.js"></script>
  <script>alreadyLoggedIn()</script>
</body>
</html>
