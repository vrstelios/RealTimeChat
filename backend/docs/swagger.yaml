basePath: /
definitions:
  model.Document:
    properties:
      LastUpdated:
        type: string
      chuckCount:
        type: integer
      file:
        type: string
      id:
        type: string
      room:
        type: string
    type: object
  model.DocumentResponse:
    properties:
      data:
        $ref: '#/definitions/model.Document'
      message:
        type: string
    type: object
  model.Users:
    properties:
      createdAt:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
      password:
        type: string
      refreshToken:
        type: string
      token:
        type: string
    type: object
info:
  contact:
    name: DoctorVeRossi
    url: https://github.com/vrstelios/RealTimeChat
  description: This is a real-time chat service API.
  title: RealTime Chat API
  version: "1.0"
paths:
  /api/documents/:
    get:
      description: Retrieves all uploaded documents for a specific room
      parameters:
      - description: Room name
        in: query
        name: room
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Document'
            type: array
        "400":
          description: Bad Request
          schema:
            type: string
        "405":
          description: Method Not Allowed
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: List documents by room
      tags:
      - documents
  /api/documents/upload:
    post:
      consumes:
      - multipart/form-data
      description: Uploads a PDF file, processes it into chunks, generates embeddings
        and stores them per room
      parameters:
      - description: Room name
        in: query
        name: room
        required: true
        type: string
      - description: PDF file to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.DocumentResponse'
        "400":
          description: Bad Request
          schema:
            type: string
        "405":
          description: Method Not Allowed
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Upload a PDF document
      tags:
      - documents
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates user and returns session cookies
      parameters:
      - description: User login payload
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/model.Users'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login user
      tags:
      - auth
  /auth/logout:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Logout user.
      tags:
      - auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Creates a new user account with username and password
      parameters:
      - description: User signup payload
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/model.Users'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "406":
          description: Not Acceptable
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Signup a new user
      tags:
      - auth
  /room:
    get:
      description: Upgrades HTTP connection to WebSocket and joins a chat room
      parameters:
      - description: Room name
        in: query
        name: room
        required: true
        type: string
      - description: Username
        in: query
        name: name
        required: true
        type: string
      - description: Enable AI responses (Gemini)
        in: query
        name: useAI
        type: boolean
      responses:
        "101":
          description: Switching Protocols
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Join a chat room via WebSocket
      tags:
      - chat
swagger: "2.0"
